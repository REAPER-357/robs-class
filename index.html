<script>
const MODES = {
  black: { bg: '0 0 0', card: '14 14 17', sunk: '0 0 0', line: '42 42 50', ink: '244 244 245', mute: '161 161 170', faint: '113 113 122', good: '52 211 153', bad: '251 113 133', warn: '251 191 36', scheme: 'dark', label: 'Black' },
  dark:  { bg: '11 16 32', card: '19 26 46', sunk: '9 13 26', line: '38 48 74', ink: '232 236 246', mute: '154 166 192', faint: '102 114 143', good: '52 211 153', bad: '251 113 133', warn: '251 191 36', scheme: 'dark', label: 'Dark' },
  light: { bg: '243 245 249', card: '255 255 255', sunk: '241 243 248', line: '218 223 234', ink: '17 24 39', mute: '75 85 99', faint: '107 114 128', good: '5 150 105', bad: '220 38 38', warn: '180 83 9', scheme: 'light', label: 'Light' }
};
const ACCENTS = { purple: '#8b5cf6', blue: '#3b82f6', green: '#22c55e', red: '#ef4444', pink: '#ec4899', orange: '#f97316', yellow: '#eab308', teal: '#14b8a6' };
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
  return [h, s, l];
}
function hslToRgb(h, s, l) {
  if (s === 0) { const v = Math.round(l * 255); return [v, v, v]; }
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [Math.round(f(h + 1 / 3) * 255), Math.round(f(h) * 255), Math.round(f(h - 1 / 3) * 255)];
}
function getTheme() {
  let t = {}; try { t = JSON.parse(localStorage.getItem('rca.theme') || '{}'); } catch {}
  return { mode: MODES[t.mode] ? t.mode : 'dark', accent: /^#[0-9a-f]{6}$/i.test(t.accent || '') ? t.accent : ACCENTS.purple };
}
function applyTheme(t) {
  const m = MODES[t.mode], root = document.documentElement.style;
  ['bg', 'card', 'sunk', 'line', 'ink', 'mute', 'faint', 'good', 'bad', 'warn'].forEach(k => root.setProperty('--' + k, m[k]));
  const [r, g, b] = hexToRgb(t.accent);
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  const [h, s, l] = rgbToHsl(r, g, b);
  const tx = hslToRgb(h, s, m.scheme === 'light' ? Math.min(l, .38) : Math.max(l, .68));
  root.setProperty('--accent', r + ' ' + g + ' ' + b);
  root.setProperty('--accent-ink', lum > .55 ? '17 24 39' : '255 255 255');
  root.setProperty('--accent-text', tx.join(' '));
  document.documentElement.style.colorScheme = m.scheme;
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = 'rgb(' + m.bg.split(' ').join(',') + ')';
}
function saveTheme(t) { try { localStorage.setItem('rca.theme', JSON.stringify(t)); } catch {} applyTheme(t); }
applyTheme(getTheme());
</script>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const LETTERS = 'ABCDEFGH';
const fmt = n => Number.isInteger(n) ? n : +n.toFixed(2);
const fmtDur = s => { s = Math.round(s); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's'; };
const fmtDate = iso => new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'fixed left-1/2 -translate-x-1/2 bottom-6 z-[60] max-w-[90vw] px-4 py-3 rounded-xl text-sm shadow-xl border bg-card ' + (type === 'error' ? 'border-bad text-bad' : 'border-line text-ink');
  t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}
const badge = (txt, kind) => `<span class="chip font-semibold text-${kind}" style="border-color:rgb(var(--${kind}) / .4);background:rgb(var(--${kind}) / .1)">${esc(txt)}</span>`;
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };

/* ---------- SHA-256 (pure JS, used for the teacher password hash) ---------- */
const sha256 = (() => {
  const P = []; for (let n = 2; P.length < 64; n++) { let ok = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { ok = false; break; } if (ok) P.push(n); }
  const fr = x => Math.floor((x - Math.floor(x)) * 4294967296);
  const K = new Uint32Array(P.map(p => fr(Math.cbrt(p))));
  const H0 = new Uint32Array(P.slice(0, 8).map(p => fr(Math.sqrt(p))));
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  return function (msg) {
    const l = msg.length, total = ((l + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total); buf.set(msg); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 4, (l * 8) >>> 0); dv.setUint32(total - 8, Math.floor(l * 8 / 4294967296));
    const h = new Uint32Array(H0), w = new Uint32Array(64);
    for (let o = 0; o < total; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const a = w[i - 15], b = w[i - 2];
        w[i] = w[i - 16] + (ror(a, 7) ^ ror(a, 18) ^ (a >>> 3)) + w[i - 7] + (ror(b, 17) ^ ror(b, 19) ^ (b >>> 10));
      }
      let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
        const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h[0] += a; h[1] += b; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += hh;
    }
    const out = new Uint8Array(32), ov = new DataView(out.buffer);
    for (let i = 0; i < 8; i++) ov.setUint32(i * 4, h[i]);
    return out;
  };
})();
const toHex = u => Array.from(u, b => b.toString(16).padStart(2, '0')).join('');
function hashPw(pw) {
  let h = sha256(new TextEncoder().encode(CONFIG.HASH_SALT + ':' + pw));
  for (let i = 0; i < CONFIG.HASH_ROUNDS; i++) h = sha256(h);
  return toHex(h);
}

/* ---------- state ---------- */
let settings = Object.assign({ webhook: '' }, LS.get('rca.settings', {}));
if (!settings.webhook) settings.webhook = CONFIG.WEBHOOK_URL || '';
let results = LS.get('rca.results', []);
let pending = LS.get('rca.pending', []);
let view = 'home', lastView = '';
let attempt = null;       // the student's quiz in progress (includes a copy of the questions)
let lastReview = null;
let unlocked = false, teacherPw = '';
let timerId = null, beatId = null, typeTimer = 0;
let deferredInstall = null;
let leaveStart = null;

// student screen
let classesData = LS.get('rca.classes', null), classesErr = '', classesLoading = false;
let stuName = LS.get('rca.stuName', ''), stuClass = LS.get('rca.stuClass', ''), starting = '';
// teacher screens
let adminData = null, adminErr = '', adminLoading = false;
let newClassName = '', classViewName = '', connMsg = '', draft = null, classRes = {};

const API = () => (settings.webhook || '').trim();
const saveSettings = () => LS.set('rca.settings', settings);
const saveAttempt = () => { if (attempt) LS.set('rca.attempt', attempt); };
const dlTime = hw => hw && hw.deadline ? new Date(hw.deadline).getTime() : 0;
const isPast = hw => !!(dlTime(hw) && Date.now() > dlTime(hw));
const isClosed = hw => isPast(hw) && !hw.allowLate;

/* ---------- talking to the Google script ---------- */
function friendlyErr(e) {
  const m = String((e && e.message) || e);
  if (m === 'not-connected') return 'The app is not connected to a Google Sheet yet.';
  if (e instanceof TypeError || /JSON|Unexpected token|Unexpected end|Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Could not get a proper reply from Google. Check your connection, the web app URL, that access is set to "Anyone", and that you pasted the newest script and deployed it as a new version.';
  return m;
}
async function apiGet(params) {
  const base = API(); if (!base) throw new Error('not-connected');
  const r = await fetch(base + (base.includes('?') ? '&' : '?') + new URLSearchParams(params).toString());
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j;
}
async function apiPost(body) {
  const base = API(); if (!base) throw new Error('not-connected');
  const r = await fetch(base, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j;
}
const admin = (action, data) => apiPost(Object.assign({ action, pw: teacherPw }, data || {}));

/* ---------- Excel / sheet parsing ---------- */
// Answers are MATCHED, not just lettered. The Answer cell can hold:
//   - the text of the correct option (a word, a number, True / False / Not Given), or a letter A-H
//   - for a row with no options: True / False / Not Given (or Yes / No / Not Given), or a typed answer
//     (a number or word). Several accepted typed answers are separated with |
const SHORT_FORMS = { t: 'true', f: 'false', ng: 'not given', 'n/g': 'not given', y: 'yes', n: 'no' };
const NOT_GIVEN = ['not given', 'notgiven', 'ng', 'n/g'];

// lower case, tidy spaces / quotes / dashes, drop punctuation at the edges
function normAns(s) {
  return String(s === null || s === undefined ? '' : s).normalize('NFKC').toLowerCase()
    .replace(/[‘’‛]/g, "'").replace(/[“”]/g, '"').replace(/[‐-―]/g, '-')
    .replace(/\s+/g, ' ').trim()
    .replace(/^[\s"'(\[{]+|[\s"'.,;:!?)\]}]+$/g, '');
}
// "1,000" and "4.0" count as numbers; anything else is NaN
function numOf(s) {
  const t = String(s).replace(/\s/g, '');
  if (/^[-+]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t) || /^[-+]?\d+(\.\d+)?$/.test(t)) return parseFloat(t.replace(/,/g, ''));
  return NaN;
}
function sameAnswer(a, b) {
  const x = normAns(a), y = normAns(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const nx = numOf(x), ny = numOf(y);
  return Number.isFinite(nx) && Number.isFinite(ny) && nx === ny;
}
const isNotGiven = s => NOT_GIVEN.includes(normAns(s));
// what kind of "no options" answer is this? 'tf' (True/False), 'yn' (Yes/No), 'ng' (Not Given) or '' (typed answer)
function implicitKind(raw) {
  const n = normAns(raw);
  if (['true', 'false', 't', 'f'].includes(n)) return 'tf';
  if (['yes', 'no', 'y', 'n'].includes(n)) return 'yn';
  if (NOT_GIVEN.includes(n)) return 'ng';
  return '';
}
// position written as a letter (A-H, "Option B") or a number (1-8, "Option 2"); -1 if it isn't one
function posOf(raw) {
  const m = String(raw).trim().match(/^(?:option|choice|opt)?[\s_.\-]*([a-h]|[1-8])[.)]?$/i);
  if (!m) return -1;
  const ch = m[1].toLowerCase();
  return /\d/.test(ch) ? parseInt(ch, 10) - 1 : ch.charCodeAt(0) - 97;
}
// Finds which option an Answer cell means. Order: the option's own text (words, numbers), then
// True/False/Yes/No/Not Given short forms, then a letter position (A-H), or a number position when the sheet answers with letters.
function resolveAnswer(raw, list, letterMode) {
  if (!raw) return { k: -1 };
  // a letter (B, "Option C") always counts as a position; a number (2, "Option 2") only in a sheet that answers with letters
  const byPosIndex = () => {
    const p = posOf(raw);
    if (p < 0 || (/\d/.test(raw) && !letterMode)) return -1;
    return list.findIndex(o => o.pos === p);
  };
  const byText = list.findIndex(o => sameAnswer(o.text, raw));
  if (byText >= 0) {
    const kp = byPosIndex();
    return { k: byText, amb: kp >= 0 && kp !== byText };
  }
  const full = SHORT_FORMS[normAns(raw)];
  if (full) {
    const k = list.findIndex(o => normAns(o.text) === full || (full === 'not given' && isNotGiven(o.text)));
    if (k >= 0) return { k };
  }
  return { k: byPosIndex() };
}

function parseRows(rows) {
  if (!rows || rows.length < 2) throw new Error('The sheet needs a header row plus at least one question.');
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const qCol = head.findIndex(h => /^q(uestion)?s?\b/.test(h));
  const aCol = head.findIndex(h => /^(correct|answer|key|ans)\b/.test(h));
  const pCol = head.findIndex(h => /^(points?|marks?)\b/.test(h));
  const optCols = [];
  head.forEach((h, i) => { if (i !== qCol && i !== aCol && i !== pCol && /^(?:option|choice|opt)?[\s_.\-]*([a-h]|[1-8])$/.test(h)) optCols.push(i); });
  if (qCol < 0) throw new Error('Could not find a "Question" column in row 1.');
  if (aCol < 0) throw new Error('Could not find an "Answer" column in row 1.');

  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const text = String(r[qCol] ?? '').trim();
    if (!text) continue;
    const list = [];
    optCols.forEach((c, pos) => { const t = String(r[c] ?? '').trim(); if (t) list.push({ text: t, pos }); });
    let pts = pCol >= 0 ? parseFloat(r[pCol]) : 1;
    if (!(pts > 0)) pts = 1;
    data.push({ n: i + 1, text, list, raw: String(r[aCol] ?? '').trim(), pts });
  }

  // facts about the whole sheet
  const answered = data.filter(d => d.raw);
  const letterMode = answered.length > 0 && answered.filter(d => /^(?:option|choice|opt)?[\s_.\-]*[a-h][.)]?$/i.test(d.raw)).length / answered.length >= 0.5;
  const bare = data.filter(d => d.list.length === 0 && d.raw);        // rows with no options
  const hasNG = bare.some(d => implicitKind(d.raw) === 'ng');
  const hasYN = bare.some(d => implicitKind(d.raw) === 'yn');
  const hasTF = bare.some(d => implicitKind(d.raw) === 'tf');
  const family = hasYN && !hasTF ? ['Yes', 'No'] : ['True', 'False'];
  const choiceWords = family.concat(hasNG ? ['Not Given'] : []);
  const mcRows = data.filter(d => d.list.length >= 2).length;

  const questions = [], warnings = [], typedRows = [];
  let nMc = 0, nAuto = 0, nText = 0;
  data.forEach(d => {
    if (!d.raw) { warnings.push(`Row ${d.n}: no answer, skipped.`); return; }
    if (d.list.length >= 2) {
      const { k, amb } = resolveAnswer(d.raw, d.list, letterMode);
      if (k < 0) { warnings.push(`Row ${d.n}: answer "${d.raw}" doesn't match any option, skipped. Spell it exactly like one of the options, or use a letter (A, B, C…).`); return; }
      if (amb) warnings.push(`Row ${d.n}: answer "${d.raw}" matches an option's text and also an option position. Used the option text "${d.list[k].text}". Use a letter (A, B, C…) if you meant the position.`);
      questions.push({ type: 'mc', q: d.text, options: d.list.map(o => o.text), answer: k, points: d.pts }); nMc++;
    } else if (d.list.length === 1) {
      warnings.push(`Row ${d.n}: only one option, skipped. Give at least two, or leave them all blank.`);
    } else if (implicitKind(d.raw)) {
      const opts = choiceWords.map((t, pos) => ({ text: t, pos }));
      const { k } = resolveAnswer(d.raw, opts, false);
      if (k < 0) { warnings.push(`Row ${d.n}: answer "${d.raw}" isn't one of ${choiceWords.join(' / ')}, skipped.`); return; }
      questions.push({ type: 'mc', q: d.text, options: choiceWords.slice(), answer: k, points: d.pts }); nAuto++;
    } else {
      const answers = splitAlts(d.raw);
      if (!answers.length) { warnings.push(`Row ${d.n}: answer "${d.raw}" isn't usable, skipped.`); return; }
      questions.push({ type: 'text', q: d.text, options: [], answers, points: d.pts }); nText++; typedRows.push(d.n);
    }
  });
  // a typed-answer row in a sheet that is otherwise multiple choice is probably a forgotten set of options
  if (mcRows > 0 && typedRows.length) {
    warnings.push(`Row${typedRows.length > 1 ? 's' : ''} ${typedRows.slice(0, 12).join(', ')}${typedRows.length > 12 ? '…' : ''}: no options, so students will TYPE the answer. If you meant multiple choice, fill in the options.`);
  }
  const parts = [];
  if (nMc) parts.push(`${nMc} multiple choice`);
  if (nAuto) parts.push(`${nAuto} ${choiceWords.join(' / ')} (options added for you)`);
  if (nText) parts.push(`${nText} typed answer${nText > 1 ? 's' : ''}`);
  return { questions, warnings, summary: parts.join(' · ') };
}

// Alternative accepted answers are separated with | (or a semicolon or new line)
const splitAlts = raw => String(raw).split(/\s*[|;\n]\s*/).map(s => s.trim()).filter(s => normAns(s));

// The SHORT ANSWERS tab: Question / Answer / Points. Every row is a question the student types the answer to.
function parseShort(rows) {
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const qCol = head.findIndex(h => /^q(uestion)?s?\b/.test(h));
  const aCol = head.findIndex(h => /^(correct|answer|key|ans)\b/.test(h));
  const pCol = head.findIndex(h => /^(points?|marks?)\b/.test(h));
  if (qCol < 0) throw new Error('Could not find a "Question" column in row 1.');
  if (aCol < 0) throw new Error('Could not find an "Answer" column in row 1.');
  const questions = [], warnings = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i], n = i + 1;
    const text = String(r[qCol] ?? '').trim();
    if (!text) continue;
    const raw = String(r[aCol] ?? '').trim();
    if (!raw) { warnings.push(`Row ${n}: no answer, skipped.`); continue; }
    const answers = splitAlts(raw);
    if (!answers.length) { warnings.push(`Row ${n}: answer "${raw}" isn't usable, skipped.`); continue; }
    if (answers.length > 10) { warnings.push(`Row ${n}: more than 10 accepted answers, skipped.`); continue; }
    if (answers.some(a => a.length > 300) || text.length > 2000) { warnings.push(`Row ${n}: the question or an answer is too long, skipped.`); continue; }
    let pts = pCol >= 0 ? parseFloat(r[pCol]) : 1;
    if (!(pts > 0)) pts = 1;
    questions.push({ type: 'text', q: text, options: [], answers, points: pts });
  }
  return { questions, warnings };
}

// A quiz with two tabs: MULTI-CHOICE first, then SHORT ANSWERS. Either tab can be missing.
function parseTwoTab(mcRows, shortRows) {
  const questions = [], warnings = [], parts = [];
  if (mcRows && mcRows.length >= 2) {
    let r;
    try { r = parseRows(mcRows); } catch (e) { throw new Error('MULTI-CHOICE tab: ' + e.message); }
    questions.push(...r.questions); r.warnings.forEach(w => warnings.push('MULTI-CHOICE ' + w.replace(/^Row/, 'row')));
    if (r.summary) parts.push(r.summary);
  }
  if (shortRows && shortRows.length >= 2) {
    let r;
    try { r = parseShort(shortRows); } catch (e) { throw new Error('SHORT ANSWERS tab: ' + e.message); }
    questions.push(...r.questions); r.warnings.forEach(w => warnings.push('SHORT ANSWERS ' + w.replace(/^Row/, 'row')));
    if (r.questions.length) parts.push(`${r.questions.length} short answer${r.questions.length > 1 ? 's' : ''}`);
  }
  return { questions, warnings, summary: parts.join(' · '), twoTab: true };
}

// is the student's answer g right for question q? (g is an option number for multiple choice, typed text otherwise)
const isRight = (q, g) => g !== undefined && (q.type === 'text' ? q.answers.some(a => sameAnswer(g, a)) : g === q.answer);

function parseWorkbook(buf) {
  const wb = XLSX.read(buf, { type: 'array' });
  const rowsOf = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' });
  const mcName = wb.SheetNames.find(n => /multi|choice/i.test(n)), saName = wb.SheetNames.find(n => /short/i.test(n));
  if (mcName || saName) return parseTwoTab(mcName ? rowsOf(mcName) : [], saName ? rowsOf(saName) : []);
  return parseRows(rowsOf(wb.SheetNames[0]));
}
function downloadTemplate() {
  const aoa = [
    ['Question', 'Option A', 'Option B', 'Option C', 'Option D', 'Answer', 'Points'],
    ['What is the capital of France?', 'Berlin', 'Paris', 'Madrid', 'Rome', 'Paris', 1],
    ['2 + 2 = ?', '3', '4', '5', '22', '4', 1],
    ['The Earth orbits the Sun.', 'True', 'False', 'Not Given', '', 'True', 1],
    ['The writer says cats are friendly.', '', '', '', '', 'Not Given', 1]
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 44 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 14 }, { wch: 8 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Quiz');
  XLSX.writeFile(wb, 'quiz-template.xlsx');
}

/* ---------- sending a student's result ---------- */
const payloadOf = r => ({ id: r.id, timestamp: r.timestamp, name: r.name, 'class': r.cls || '', hwId: r.hwId || '', quiz: r.quiz, score: r.score, total: r.total, percent: r.percent, correct: r.correct, questions: r.questions, seconds: r.seconds, late: !!r.late, deadline: r.deadline || '', integrity: r.integrity || null, log: r.log || [], answers: r.answers || [] });
async function sendResult(rec) {
  if (!API()) return 'nohook';
  const opts = { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payloadOf(rec)) };
  let resp = null;
  try { resp = await fetch(API(), opts); } catch { resp = null; }
  if (resp) {
    // Google answered: only call it sent if the script says it saved the result
    try { const j = await resp.json(); return j.ok ? 'sent' : 'failed'; } catch { return 'failed'; }
  }
  // No readable reply (offline, or the browser hid it). Try once without needing a reply:
  // if that gets out it counts as sent, and the script ignores a repeat of the same result.
  try { await fetch(API(), Object.assign({}, opts, { mode: 'no-cors' })); return 'sent'; } catch { return 'failed'; }
}
async function deliver(rec) {
  setStatus('sending');
  const r = await sendResult(rec);
  if (r === 'sent') { rec.sent = true; pending = pending.filter(p => p.id !== rec.id); }
  else if (r === 'failed' && !pending.some(p => p.id === rec.id)) pending.push(rec);
  LS.set('rca.results', results); LS.set('rca.pending', pending);
  setStatus(r);
}
async function retryPending() {
  if (!API() || !pending.length) return;
  for (const rec of pending.slice()) {
    const r = await sendResult(rec);
    if (r === 'sent') { pending = pending.filter(p => p.id !== rec.id); const row = results.find(x => x.id === rec.id); if (row) row.sent = true; }
  }
  LS.set('rca.results', results); LS.set('rca.pending', pending);
  if (view === 'home') render();
}
function setStatus(state) {
  const el = $('#sendStatus'); if (!el) return;
  const map = {
    sending: ['text-mute', 'Sending your score…'],
    sent: ['text-good', '✓ Your score and answers were sent to your teacher.'],
    nohook: ['text-warn', 'Your score is saved on this device. The app is not connected to a Google Sheet yet.'],
    failed: ['text-warn', "Couldn't send right now. Your score is saved and will retry automatically."]
  };
  const [cls, txt] = map[state];
  el.className = 'mt-6 text-sm ' + cls;
  el.innerHTML = esc(txt) + (state === 'failed' ? ' <button data-act="retryNow" class="underline font-semibold">Retry now</button>' : '');
}

/* ---------- Google Apps Script (paste into the Sheet) ---------- */
const APPS_SCRIPT = String.raw`// Rob's Class: Google Sheets backend (version 4)
// Paste this whole script into Extensions > Apps Script (from inside the Google Sheet you want to use).

// Same password you use for the Teacher button. The app's "Copy" button fills this in for you.
var TEACHER_PASSWORD = 'YOUR_PASSWORD_HERE';
var VERSION = 4;

var H_RESULTS = ['Timestamp', 'Name', 'Class', 'Homework', 'Score', 'Total', 'Percent', 'Late', 'Flags', 'Seconds', 'HW ID', 'ID'];
var H_ANSWERS = ['ID', 'Name', 'Quiz', '#', 'Question', 'Student answer', 'Correct answer', 'Correct?', 'Points'];
var H_LOG = ['ID', 'Name', 'Quiz', 'Seconds into quiz', 'Event', 'Detail'];
var H_CLASSES = ['Class', 'Created'];
var H_HW = ['ID', 'Title', 'Classes', 'Deadline', 'Allow late', 'Minutes', 'Shuffle questions', 'Shuffle options', 'Show answers', 'Block copy', 'Status', 'Issued', 'Source', 'Questions'];
var H_Q = ['HW ID', '#', 'Question', 'Options', 'Answer', 'Points'];

// Actions that change the Sheet. They run one at a time so two students submitting together can't collide.
// (classResults is here because it makes the class's results Sheet the first time it is opened.)
var WRITE_ACTIONS = { submit: 1, addClass: 1, deleteClass: 1, issue: 1, updateHw: 1, deleteHw: 1, classResults: 1 };

// ---------- entry points ----------
function doGet(e) {
  var p = (e && e.parameter) || {};
  if (!p.action) return ContentService.createTextOutput("Rob's Class webhook is live (v" + VERSION + ")");
  try {
    if (p.action === 'ping') return json_({ ok: true, version: VERSION });
    if (p.action === 'classes') return json_({ ok: true, classes: publicClasses_() });
    if (p.action === 'quiz') return json_(getQuiz_(p.id));
    return json_({ ok: false, error: 'Unknown action' });
  } catch (err) {
    return json_({ ok: false, error: msg_(err) });
  }
}

function doPost(e) {
  var d;
  try {
    d = JSON.parse(e.postData.contents);
  } catch (err) {
    return json_({ ok: false, error: 'Bad request' });
  }
  var a = (d && d.action) || 'submit';
  try {
    // Students need no password. Everything else does. Checked before taking the lock, so wrong guesses can't hold up students.
    if (a !== 'submit') checkPassword_(d.pw);

    if (!WRITE_ACTIONS[a]) {
      switch (a) {
        case 'adminPing': return json_({ ok: true, version: VERSION });
        case 'adminList': return json_(adminList_());
        case 'readSheet': return json_(readSheet_(d.url));
      }
      return json_({ ok: false, error: 'Unknown action' });
    }

    var lock = LockService.getScriptLock();
    try {
      lock.waitLock(30000);
    } catch (err) {
      return json_({ ok: false, error: 'The Google script is busy. Try again in a moment.' });
    }
    try {
      switch (a) {
        case 'submit': return json_(saveResult_(d));
        case 'addClass': return json_(addClass_(d.name));
        case 'deleteClass': return json_(deleteClass_(d.name));
        case 'issue': return json_(issue_(d));
        case 'updateHw': return json_(updateHw_(d));
        case 'deleteHw': return json_(deleteHw_(d.id));
        case 'classResults': return json_(classResults_(d.name));
      }
    } finally {
      lock.releaseLock();
    }
    return json_({ ok: false, error: 'Unknown action' });
  } catch (err) {
    return json_({ ok: false, error: msg_(err) });
  }
}

// Run this once from the editor (choose "setup" and press Run) to grant permission and create the tabs.
function setup() {
  sheet_('Results', H_RESULTS);
  sheet_('Answers', H_ANSWERS);
  sheet_('Activity log', H_LOG);
  sheet_('Classes', H_CLASSES, true);
  sheet_('Homework', H_HW, true);
  sheet_('Questions', H_Q, true);
  Logger.log('Ready. Your tabs are in: ' + ss_().getUrl());
}

// ---------- helpers ----------
function json_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function msg_(err) {
  return String((err && err.message) || err);
}

function ss_() {
  return SpreadsheetApp.getActiveSpreadsheet();
}

// Finds a tab (creating it with a header row if needed). If an older tab with the same name has
// different columns, it is renamed "(old ...)" and a fresh one is made, so nothing is lost.
function sheet_(name, headers, asText, target) {
  var ss = target || ss_();
  var sh = ss.getSheetByName(name);
  if (sh && sh.getLastRow() > 0) {
    var cur = sh.getRange(1, 1, 1, headers.length).getValues()[0].join('|');
    if (cur !== headers.join('|')) {
      sh.setName(name + ' (old ' + Utilities.formatDate(new Date(), 'UTC', 'yyyy-MM-dd HHmmss') + ')');
      sh = null;
    }
  }
  if (!sh) {
    sh = ss.insertSheet(name);
    if (asText) sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).setNumberFormat('@');
  }
  if (sh.getLastRow() === 0) {
    sh.appendRow(headers);
    sh.setFrozenRows(1);
    sh.getRange(1, 1, 1, headers.length).setFontWeight('bold');
  }
  return sh;
}

function append_(sh, rows) {
  if (rows.length) sh.getRange(sh.getLastRow() + 1, 1, rows.length, rows[0].length).setValues(rows);
}

// Stops names/answers that start with = + - @ from running as spreadsheet formulas
function safe_(v) {
  v = (v === null || v === undefined) ? '' : String(v);
  return ['=', '+', '-', '@'].indexOf(v.charAt(0)) !== -1 ? "'" + v : v;
}

// For teacher-typed names and titles: tidy spaces and drop leading = + - @
function clean_(s) {
  return String(s === null || s === undefined ? '' : s).replace(/\s+/g, ' ').replace(/^[=+\-@\s]+/, '').trim();
}

function cap_(v, n) {
  return String(v === null || v === undefined ? '' : v).slice(0, n);
}

function num_(v) {
  v = Number(v);
  return isFinite(v) ? v : 0;
}

// Wrong guesses are slowed down (not locked out), so a student can't lock the teacher out by guessing.
function checkPassword_(pw) {
  if (!TEACHER_PASSWORD || TEACHER_PASSWORD.indexOf('YOUR_PASSWORD') === 0) {
    throw new Error('Set TEACHER_PASSWORD at the top of the Google script (use the Copy button in the app, which fills it in).');
  }
  if (typeof pw !== 'string' || pw !== TEACHER_PASSWORD) {
    Utilities.sleep(2000);
    throw new Error('The password in the Google script does not match the one you typed. Copy the script from the app again and redeploy.');
  }
}

// ---------- one results Sheet per class ----------
// Each class gets its own Google Sheet (made in your Drive the first time it is needed) holding
// that class's Results, Answers and Activity log tabs. The link between a class and its Sheet is
// kept in the script's own storage, so the Classes tab stays as it was.
function props_() {
  return PropertiesService.getScriptProperties();
}

function classKey_(name) {
  return 'rs:' + String(name).toLowerCase();
}

// the class name as it is written in the Classes tab, or '' if there is no such class
function knownClass_(name) {
  var want = String(name || '').replace(/\s+/g, ' ').trim().toLowerCase();
  var list = classNames_();
  for (var i = 0; i < list.length; i++) {
    if (list[i].toLowerCase() === want) return list[i];
  }
  return '';
}

// the class's results Sheet if it already exists, otherwise null (never creates one)
function classSsIfAny_(name) {
  var id = props_().getProperty(classKey_(name));
  if (!id) return null;
  try { return SpreadsheetApp.openById(id); } catch (err) { return null; }
}

// the class's results Sheet, created if it does not exist yet
function classSs_(name) {
  var ss = classSsIfAny_(name);
  if (ss) return ss;
  ss = SpreadsheetApp.create("Rob's Class - " + name + ' - results');
  props_().setProperty(classKey_(name), ss.getId());
  var first = ss.getSheets()[0];
  sheet_('Results', H_RESULTS, false, ss);
  sheet_('Answers', H_ANSWERS, false, ss);
  sheet_('Activity log', H_LOG, false, ss);
  try { if (first && first.getName() !== 'Results') ss.deleteSheet(first); } catch (err) { /* the empty first tab can stay */ }
  return ss;
}

// ---------- results from students ----------
function saveResult_(d) {
  var name = safe_(cap_(d.name, 60).replace(/\s+/g, ' ').trim());
  var id = cap_(d.id, 40);
  if (!name || !id) throw new Error('Missing name or id.');

  // A student in a real class goes to that class's own Sheet; anything else lands in this Sheet.
  var cls = knownClass_(d['class']);
  var tss = cls ? classSs_(cls) : ss_();

  var res = sheet_('Results', H_RESULTS, false, tss);
  var n = res.getLastRow();
  var ids = n > 1 ? res.getRange(2, 12, n - 1, 1).getValues().map(function (r) { return r[0]; }) : [];
  if (ids.indexOf(id) !== -1) return { ok: true, duplicate: true };

  var ts = new Date(d.timestamp);
  if (isNaN(ts.getTime())) ts = new Date();
  var integ = d.integrity || {};
  var flags = integ.flagged ? cap_(integ.summary, 500) : '';
  var quiz = safe_(cap_(d.quiz, 100));
  res.appendRow([ts, name, safe_(cls || cap_(d['class'], 60)), quiz, num_(d.score), num_(d.total), num_(d.percent),
    d.late ? 'LATE' : '', safe_(flags), num_(d.seconds), cap_(d.hwId, 40), id]);
  var r = res.getLastRow();
  if (flags) res.getRange(r, 1, 1, H_RESULTS.length).setBackground('#fde2e2');
  else if (d.late) res.getRange(r, 1, 1, H_RESULTS.length).setBackground('#fff4cc');

  var rows = (d.answers || []).slice(0, 300).map(function (a) {
    return [id, name, quiz, num_(a.n), safe_(cap_(a.q, 500)), safe_(cap_(a.chosen, 300)), safe_(cap_(a.correctAnswer, 300)), a.ok ? 'YES' : 'NO', num_(a.earned)];
  });
  append_(sheet_('Answers', H_ANSWERS, false, tss), rows);

  var log = (d.log || []).slice(0, 300).map(function (l) {
    return [id, name, quiz, num_(l.t), safe_(cap_(l.type, 60)), safe_(cap_(l.detail, 200))];
  });
  append_(sheet_('Activity log', H_LOG, false, tss), log);
  return { ok: true };
}

// ---------- classes ----------
function classNames_() {
  var sh = sheet_('Classes', H_CLASSES, true);
  var n = sh.getLastRow();
  if (n < 2) return [];
  return sh.getRange(2, 1, n - 1, 1).getValues().map(function (r) { return String(r[0]); }).filter(function (s) { return s; });
}

function addClass_(name) {
  name = clean_(name);
  if (!name) throw new Error('Type a class name.');
  if (name.length > 40) throw new Error('Class name is too long (40 characters max).');
  var list = classNames_();
  for (var i = 0; i < list.length; i++) {
    if (list[i].toLowerCase() === name.toLowerCase()) throw new Error('That class already exists.');
  }
  sheet_('Classes', H_CLASSES, true).appendRow([name, new Date().toISOString()]);
  var url = '';
  try { url = classSs_(name).getUrl(); } catch (err) { /* it will be created when the first result arrives */ }
  return { ok: true, classes: classNames_(), sheetUrl: url };
}

function deleteClass_(name) {
  var sh = sheet_('Classes', H_CLASSES, true);
  var n = sh.getLastRow();
  if (n > 1) {
    var vals = sh.getRange(2, 1, n - 1, 1).getValues();
    for (var i = vals.length - 1; i >= 0; i--) {
      if (String(vals[i][0]) === String(name)) sh.deleteRow(i + 2);
    }
  }
  return { ok: true, classes: classNames_() };
}

// ---------- homework ----------
function rowToHw_(r) {
  var classes = [];
  try { classes = JSON.parse(r[2]) || []; } catch (e) { classes = []; }
  return {
    id: String(r[0]), title: String(r[1]), classes: classes, deadline: String(r[3] || ''),
    allowLate: String(r[4]) !== 'no', minutes: Number(r[5]) || 0,
    shuffleQ: String(r[6]) === 'yes', shuffleO: String(r[7]) === 'yes',
    showReview: String(r[8]) === 'yes', blockCopy: String(r[9]) !== 'no',
    status: String(r[10]) || 'open', issued: String(r[11] || ''), source: String(r[12] || ''), count: Number(r[13]) || 0
  };
}

function readHw_() {
  var sh = sheet_('Homework', H_HW, true);
  var n = sh.getLastRow();
  if (n < 2) return [];
  return sh.getRange(2, 1, n - 1, H_HW.length).getValues().map(rowToHw_).filter(function (h) { return h.id; });
}

function publicHw_(h) {
  return { id: h.id, title: h.title, classes: h.classes, deadline: h.deadline, allowLate: h.allowLate, minutes: h.minutes,
    shuffleQ: h.shuffleQ, shuffleO: h.shuffleO, showReview: h.showReview, blockCopy: h.blockCopy, count: h.count };
}

function findRow_(sh, id) {
  var n = sh.getLastRow();
  if (n < 2) return 0;
  var ids = sh.getRange(2, 1, n - 1, 1).getValues();
  for (var i = 0; i < ids.length; i++) {
    if (String(ids[i][0]) === String(id)) return i + 2;
  }
  return 0;
}

function publicClasses_() {
  var open = readHw_().filter(function (h) { return h.status === 'open'; });
  return classNames_().map(function (name) {
    return {
      name: name,
      homework: open.filter(function (h) { return h.classes.indexOf(name) !== -1; }).map(publicHw_)
    };
  });
}

function getQuiz_(id) {
  var hw = null;
  readHw_().forEach(function (h) { if (h.id === String(id)) hw = h; });
  if (!hw) throw new Error('That homework was not found.');
  if (hw.status !== 'open') throw new Error('This homework has been closed by your teacher.');
  var sh = sheet_('Questions', H_Q, true);
  var n = sh.getLastRow();
  var qs = [];
  if (n > 1) {
    sh.getRange(2, 1, n - 1, H_Q.length).getValues().forEach(function (r) {
      if (String(r[0]) === hw.id) {
        var raw = String(r[4]);
        var item = { n: Number(r[1]), q: String(r[2]), options: JSON.parse(r[3]), points: Number(r[5]) || 1 };
        if (raw.charAt(0) === '[') { item.type = 'text'; item.answers = JSON.parse(raw); }

/* ---------- integrity tracking ---------- */
const newStats = () => ({ leaves: 0, awayMs: 0, copies: 0, pastes: 0, menus: 0, prints: 0, resumes: 0 });
const tracking = () => view === 'quiz' && attempt && !attempt.done;
function ev(type, detail) {
  if (!attempt || attempt.done) return;
  if (attempt.log.length < 300) attempt.log.push({ t: Math.round((Date.now() - attempt.startedAt) / 1000), type, detail: detail || '' });
  saveAttempt();
}
function onLeave(why) {
  if (!tracking() || leaveStart) return;
  leaveStart = Date.now(); attempt.stats.leaves++; ev('left page', why);
}
function onReturn() {
  if (!tracking() || !leaveStart) return;
  const d = Date.now() - leaveStart; leaveStart = null;
  attempt.stats.awayMs += d; ev('came back', 'away ' + fmtDur(d / 1000));
}
function resumeAttempt() {
  const away = Date.now() - (attempt.lastSeen || Date.now());
  if (away > 6000) {
    attempt.stats.leaves++; attempt.stats.resumes++; attempt.stats.awayMs += away;
    ev('closed or left quiz, then resumed', 'away ' + fmtDur(away / 1000));
  }
  attempt.lastSeen = Date.now(); saveAttempt();
}
function integrityOf(a, seconds) {
  const s = a.stats, parts = [];
  if (s.leaves) parts.push(`Left the page ${s.leaves}× (${fmtDur(s.awayMs / 1000)} away)`);
  if (s.copies) parts.push(`copy/cut attempt ${s.copies}×`);
  if (s.pastes) parts.push(`paste ${s.pastes}×`);
  if (s.prints) parts.push(`print/save/screenshot key ${s.prints}×`);
  if (s.resumes) parts.push(`closed or reloaded and resumed ${s.resumes}×`);
  const n = a.order.length, fast = n >= 5 && seconds / n < 2.5;
  if (fast) parts.push(`finished unusually fast (${fmtDur(seconds)} for ${n} questions)`);
  const minor = s.menus ? `right-click ${s.menus}×` : '';
  return { flagged: parts.length > 0, summary: (parts.concat(minor ? [minor] : [])).join('; ') || 'No issues detected', leaves: s.leaves, awaySeconds: Math.round(s.awayMs / 1000), copies: s.copies, pastes: s.pastes, prints: s.prints, rightClicks: s.menus, resumes: s.resumes, fast };
}
function installGuards() {
  document.addEventListener('visibilitychange', () => document.hidden ? onLeave('tab hidden or app switched') : onReturn());
  window.addEventListener('blur', () => onLeave('window lost focus'));
  window.addEventListener('focus', onReturn);
  // While the window is covered or in the background, blur the quiz (app-switcher previews, overlays, split screen)
  const cover = on => document.body.classList.toggle('cover', !!on && tracking());
  document.addEventListener('visibilitychange', () => cover(document.hidden));
  window.addEventListener('blur', () => cover(true));
  window.addEventListener('focus', () => cover(false));
  // Closing the tab or pressing Back during a quiz asks first
  window.addEventListener('beforeunload', e => { if (tracking()) { e.preventDefault(); e.returnValue = ''; return ''; } });
  window.addEventListener('popstate', () => { if (tracking()) backAttempt(); });
  window.addEventListener('pagehide', () => { if (tracking()) { attempt.lastSeen = Date.now(); saveAttempt(); } });
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!tracking()) return; attempt.stats.copies++; ev(t, 'tried to ' + t + ' text'); if (attempt.hw && attempt.hw.blockCopy !== false) e.preventDefault(); }));
  document.addEventListener('paste', () => { if (!tracking()) return; attempt.stats.pastes++; ev('paste', 'pasted into the page'); });
  document.addEventListener('contextmenu', e => { if (!tracking()) return; attempt.stats.menus++; ev('right-click', ''); if (attempt.hw && attempt.hw.blockCopy !== false) e.preventDefault(); });
  window.addEventListener('beforeprint', () => { if (!tracking()) return; attempt.stats.prints++; ev('print', 'print dialog opened'); });
  document.addEventListener('keydown', e => {
    if (!tracking()) return;
    const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (k === 'printscreen' || (mod && (k === 'p' || k === 's')) || (e.metaKey && e.shiftKey && ['3', '4', '5', 's'].includes(k))) { attempt.stats.prints++; ev('shortcut', (mod ? 'Ctrl/Cmd+' : '') + (e.key || '')); }
  });
}

/* ----- student: quiz + result ----- */
function quizView() {
  const Q = attempt.quiz;
  const isT = qi => Q.questions[qi].type === 'text';
  attempt.order = attempt.order.filter(x => !isT(x.qi)).concat(attempt.order.filter(x => isT(x.qi)));
  const nMc = attempt.order.filter(x => !isT(x.qi)).length;
  const twoParts = nMc > 0 && nMc < attempt.order.length;      // multiple choice on page 1, short answers on page 2
  const part = twoParts ? Math.min(attempt.part || 0, 1) : 0;
  const cards = attempt.order.map(({ qi, o }, n) => ({ qi, o, n })).filter(x => !twoParts || (part === 0) === !isT(x.qi)).map(({ qi, o, n }) => {
    const q = Q.questions[qi];
    return `<section class="card">
      <div class="flex gap-3">
        <div class="shrink-0 w-8 h-8 rounded-lg bg-sunk border border-line grid place-items-center text-sm font-bold text-accent-text">${n + 1}</div>
        <h3 class="font-semibold text-lg leading-snug pt-0.5">${esc(q.q)}</h3>
      </div>
      ${q.type === 'text' ? typedInput(qi) : ''}
      <div class="mt-4 space-y-2.5">
        ${o.map((oi, d) => `
          <label class="block cursor-pointer opt">
            <input type="radio" class="sr-only" name="q${qi}" data-q="${qi}" value="${oi}" ${attempt.answers[qi] === oi ? 'checked' : ''}>
            <div class="optbox">
              <span class="shrink-0 w-7 h-7 rounded-full border border-line grid place-items-center text-xs font-bold text-mute">${LETTERS[d]}</span>
              <span class="text-[15px]">${esc(q.options[oi])}</span>
            </div></label>`).join('')}
      </div></section>`;
  }).join('');
  return `<div class="-mx-4 -mt-8 sm:-mt-10 px-4 py-3 sticky top-14 z-20 bg-bg/90 backdrop-blur border-b border-line">
      <div class="max-w-3xl mx-auto">
        <div class="flex items-center justify-between text-sm gap-3"><div class="truncate"><span class="text-faint">Student</span> <b>${esc(attempt.name)}</b> <span class="text-faint">· ${esc(attempt.cls)}</span></div><div id="timer" class="font-mono"></div></div>
        <div class="mt-2 h-2 rounded-full bg-sunk border border-line overflow-hidden"><div id="bar" class="h-full bg-accent transition-all duration-300" style="width:0%"></div></div>
        <div id="progressText" class="mt-1 text-xs text-mute"></div>
      </div></div>
    <div class="max-w-3xl mx-auto mt-6 space-y-5 ${attempt.hw.blockCopy ? 'noselect' : ''}">
      <h1 class="text-2xl font-extrabold tracking-tight">${esc(Q.title)}</h1>
      <p class="text-xs text-faint -mt-3">Your name is shown faintly over this quiz. Screenshots, copying and leaving the page are recorded and sent to your teacher.</p>
      ${twoParts ? `<div class="text-sm font-bold text-accent-text -mb-2">Part ${part + 1} of 2 · ${part === 0 ? 'Multiple choice' : 'Short answers'}</div>` : ''}
      ${(!twoParts || part === 1) && Q.questions.some(q => q.type === 'text') ? `<p class="text-sm text-mute -mt-2">For typed answers, spelling counts but capital letters don't.</p>` : ''}
      ${cards}
      ${twoParts && part === 0 ? `<button data-act="nextPart" class="btn btn-primary w-full" style="padding:1rem;font-size:1rem">Next: short answers →</button>`
        : twoParts ? `<div style="display:grid;grid-template-columns:1fr 2fr;gap:.75rem"><button data-act="prevPart" class="btn btn-ghost" style="padding:1rem">← Back</button><button data-act="submit" class="btn btn-primary" style="padding:1rem;font-size:1rem">Submit answers</button></div>`
        : `<button data-act="submit" class="btn btn-primary w-full" style="padding:1rem;font-size:1rem">Submit answers</button>`}
    </div>`;
}

function resultView() {
  const r = lastReview.rec, Q = lastReview.quiz;
  const col = r.percent >= 80 ? 'good' : r.percent >= 50 ? 'warn' : 'bad';
  const C = 2 * Math.PI * 52;
  const msg = r.percent >= 90 ? 'Outstanding!' : r.percent >= 75 ? 'Great work!' : r.percent >= 50 ? 'Good effort. Keep practising.' : 'Keep going. Review and try again.';
  const review = lastReview.hw.showReview ? lastReview.order.map(({ qi }, n) => {
    const q = Q.questions[qi]; const given = lastReview.answers[qi]; const ok = isRight(q, given), isT = q.type === 'text';
    return `<li class="rounded-xl border ${ok ? 'border-good/40 bg-good/5' : 'border-bad/40 bg-bad/5'} p-4">
      <div class="font-medium text-sm"><span class="text-faint">${n + 1}.</span> ${esc(q.q)}</div>
      <div class="mt-2 text-sm ${ok ? 'text-good' : 'text-bad'}">${ok ? '✓' : '✗'} Your answer: ${given === undefined ? '<i>no answer</i>' : esc(isT ? given : q.options[given])}</div>
      ${ok ? '' : `<div class="mt-1 text-sm text-good">Correct answer: ${esc(isT ? q.answers.join(' / ') : q.options[q.answer])}</div>`}
    </li>`;
  }).join('') : '';
  return `<div class="max-w-2xl mx-auto">
    <section class="card text-center">
      <div class="text-sm text-mute">${esc(r.name)} · ${esc(r.cls)}</div>
      <div class="relative w-40 h-40 mx-auto mt-3">
        <svg viewBox="0 0 120 120" class="w-40 h-40 -rotate-90"><circle cx="60" cy="60" r="52" fill="none" stroke="rgb(var(--line))" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="rgb(var(--${col}))" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - r.percent / 100)}"/></svg>
        <div class="absolute inset-0 grid place-items-center"><div class="text-4xl font-extrabold">${r.percent}%</div></div>
      </div>
      <div class="mt-4 text-2xl font-bold">${fmt(r.score)} / ${fmt(r.total)} points</div>
      <div class="text-mute mt-1">${r.correct} of ${r.questions} correct</div>
      <div class="mt-3 font-semibold text-${col}">${msg}</div>
      ${r.late ? `<div class="mt-3">${badge('Submitted after the deadline (LATE)', 'warn')}</div>` : ''}
      ${r.integrity && r.integrity.flagged ? `<div class="mt-4 rounded-xl border border-warn/40 bg-warn/10 text-warn text-sm p-3 text-left"><b>Noted for your teacher:</b> ${esc(r.integrity.summary)}</div>` : ''}
      <div id="sendStatus"></div>

const APP_BUILD = '20261021-084541';

    if (!safeToReload()) { if (!updateTold) { updateTold = true; toast('A new version is ready. It loads when you go back to the home screen.'); } return; }
    try { if (sessionStorage.getItem('rca.updTried') === m[1]) return; sessionStorage.setItem('rca.updTried', m[1]); } catch {}   // never loop
    try { (await caches.keys()).forEach(k => caches.delete(k)); } catch {}
    try { (await navigator.serviceWorker.getRegistrations()).forEach(g => g.unregister()); } catch {}
    location.reload();
  } catch {}
}

/* ---------- boot ---------- */
(function init() {
  installGuards();
  if (location.hash === '#hash') view = 'hashtool';
  const saved = LS.get('rca.attempt', null);
  if (saved && (saved.done || !saved.quiz || !saved.hw || Date.now() - saved.startedAt > 12 * 3600 * 1000)) LS.del('rca.attempt');
  LS.del('rca.quiz');
  render();
  retryPending();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => reg.update().catch(() => {})).catch(() => {});
  }
  checkForUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
})();
</script>
